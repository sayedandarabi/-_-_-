<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Vazirmatn', sans-serif; background: #0F766E; }
    .slide-container { width: 1280px; min-height: 720px; background: #0F766E; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 48px; }
    .accent-bar { position: absolute; top: 0; left: 0; width: 100%; height: 6px; display: flex; }
    .bar-mvp { width: 50%; height: 100%; background: #D4A72C; }
    .bar-prod { width: 50%; height: 100%; background: #D9775B; }
    h1 { font-size: 80px; font-weight: 700; color: #F7F3E8; margin-bottom: 24px; text-align: center; }
    h2 { font-size: 32px; color: #D4A72C; margin-bottom: 48px; text-align: center; }
    .meta { position: absolute; bottom: 48px; color: #F7F3E8; opacity: 0.8; font-size: 18px; display: flex; gap: 24px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="accent-bar">
      <div class="bar-mvp"></div>
      <div class="bar-prod"></div>
    </div>
    
    <div class="text-center">
      <h1>آفلاین، قابل اتکا، قابل همگام‌سازی</h1>
      <h2>معماری و وضعیت پیاده‌سازی MVP حسابداری افغانستان</h2>
    </div>

    <div class="meta">
      <span>Engineering Review Deck</span>
      <span>•</span>
      <span>October 2026</span>
    </div>
  </div>
</body>
</html>
